<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kanz-e-Adfar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="siteHeader">
  <h1 id="mainTitle">
    Kanz-e-Adfar <span class="urdu">( کنز أدفر )</span>
  </h1>

  <p class="subtitle">
    Kashmiri Poetic Translation of the Holy Qur’an
  </p>

  <p class="description">
    A respectful presentation of the Qur’anic Surahs translated into
    Kashmiri poetic and rhythmic expression.
  </p>
</header>

<main id="app">

  <section id="homeSection">
    
    <div class="top-buttons">
      <button class="home-btn about-adfar" onclick="openPDF('data/about -adfar.pdf')">About Adfar</button>
      <button class="home-btn rhyme" onclick="openPDF('data/papa\'s rhyme.pdf')">Rhyme</button>
    </div>

    <div class="books-container">
      
      <div class="book-card" onclick="showList('amma')">
        <div class="book-cover">
          <img src="https://i.ibb.co/PGLGC9PW/IMG-20260216-033226.png" alt="Amma Para Cover" id="img-amma">
        </div>
        <div class="book-title">Amma Para</div>
      </div>

      <div class="book-card" onclick="showList('sadaye')">
        <div class="book-cover">
           <img src="https://i.ibb.co/MksQL9DZ/IMG-20260216-014715.png" alt="Sadaye Siam Cover" id="img-sadaye">
        </div>
        <div class="book-title">Sadaye Siyam</div>
      </div>

      <div class="book-card" onclick="showList('kalam')">
        <div class="book-cover">
           <img src="https://i.ibb.co/Y46gd2qj/IMG-20260226-222913.png" alt="Kalam-e-Adfar Cover" id="img-kalam">
        </div>
        <div class="book-title">Kalam-e-Adfar</div>
      </div>

      <div class="book-card" onclick="showList('Sadaye-e-Kalam')">
        <div class="book-cover">
           <img src="https://i.ibb.co/mV7dyxYS/IMG-20260227-001249.png" alt="Kalam-e-Adfar" id="img-kalam">
        </div>
        <div class="book-title">Sadaye-e-Kalam</div>
      </div>

    </div>
  </section>

  <section id="listSection" style="display: none;">
    <ul id="surahList"></ul>
  </section>

  <section id="viewerSection" style="display: none;">
    <button id="backBtn">← Back</button>
    <div id="pdfViewer"></div>
  </section>

</main>

<footer>
  <p>© Kanz-e-Adfar</p>
</footer>

<script src="script.js"></script>
</body>
</html>
